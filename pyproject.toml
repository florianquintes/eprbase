[project]
name = "eprbase"
version = "0.1.0"
description = "Low-level framework for EPR simulations using CPU and GPU."
readme = "README.md"
authors = [
    { name = "florianquintes", email = "florian.quintes@pc.uni-freiburg.de" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.7.5",
    "numexpr>=2.8.6",
    "numpy>=2.5.1",
    "scipy>=1.10.1",
    "tqdm>=4.68.4",
]

[project.optional-dependencies]
gpu = [
    "cupy-cuda13x>=14.1.1",
    "pynvml>=11.5.3",
]

[project.scripts]
eprbase = "eprbase:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "myst-parser>=5.1.0",
    "pytest>=9.1.1",
    "ruff>=0.15.21",
    "sphinx>=9.1.0",
    "sphinx-autodoc-typehints>=3.12.1",
    "sphinx-copybutton>=0.5.2",
    "sphinx-rtd-theme>=3.1.0",
]
